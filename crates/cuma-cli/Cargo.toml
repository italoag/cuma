[package]
name = "cuma-cli"
description = "The CUMA meta-agent harness command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cuma"
path = "src/main.rs"

[dependencies]
cuma-core.workspace = true
cuma-config.workspace = true
cuma-registry.workspace = true
cuma-router.workspace = true
cuma-resilience.workspace = true
cuma-planner.workspace = true
cuma-orchestrator.workspace = true
cuma-usage.workspace = true
cuma-persistence.workspace = true
cuma-memory.workspace = true
cuma-skills.workspace = true
cuma-protocol-acp.workspace = true
cuma-protocol-a2a.workspace = true
cuma-protocol-mcp.workspace = true
cuma-server-acp.workspace = true
cuma-workspace.workspace = true
cuma-providers.workspace = true
cuma-testkit.workspace = true
cuma-tui.workspace = true

clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
rand.workspace = true
which.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true

opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }

[features]
default = []
# Export traces over OTLP/HTTP (`telemetry.otlp_endpoint`). Off by default: it
# adds a dependency tree most installs do not need.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[lints]
workspace = true
