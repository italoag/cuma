server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  shutdown_timeout: "10s"

scanner:
  default_interface: ""
  arp_timeout: "5s"
  mdns_timeout: "10s"
  ssdp_timeout: "10s"
  port_scan_timeout: "2s"
  banner_timeout: "5s"
  port_scan_workers: 20
  target_ports: [80, 443, 1883, 5683, 8080, 8443, 8883, 5000, 9000]
  auto_scan_interval: "0s"

auth:
  mode: "both"
  jwt_secret: "change-me-in-production"
  api_keys: []
  token_ttl: "24h"
  admin_username: "admin"
  admin_password: "change-me"

database:
  driver: "sqlite"
  dsn: "./cuma.db"

log:
  level: "info"
  format: "json"
