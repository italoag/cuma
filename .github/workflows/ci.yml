name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # OTLP export is behind a feature; keep it compiling and lint-clean.
      - name: Clippy (otel feature)
        run: cargo clippy -p cuma-cli --features otel --all-targets -- -D warnings

      # Benchmarks are not run in CI (shared runners make timings noise), but
      # they must keep compiling.
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace declares rust-version = "1.88"; this proves it.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace
